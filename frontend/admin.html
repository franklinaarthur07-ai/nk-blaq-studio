<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · NK Blaq Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0a0a0a;
      --black-2: #121212;
      --black-3: #1a1a1a;
      --gold: #c9a24b;
      --gold-2: #e0bc6a;
      --white: #f5f5f5;
      --grey: #a8a8a8;
      --grey-2: #6b6b6b;
      --line: rgba(201,162,75,.2);
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
      min-height: 100vh;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 32px;
    }

    /* ---------- LOGIN ---------- */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 80% 20%, rgba(201,162,75,.12), transparent 55%),
        radial-gradient(circle at 15% 90%, rgba(201,162,75,.06), transparent 55%),
        var(--black);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--black-2);
      border: 1px solid var(--line);
      padding: 48px 40px;
      text-align: center;
    }

    .login-logo {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      color: var(--gold);
      display: grid; place-items: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      margin: 0 auto 24px;
    }

    .login-card h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .login-card h1 em { color: var(--gold); font-style: italic; }
    .login-card p { color: var(--grey); font-size: .9rem; margin-bottom: 32px; }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      background: var(--black);
      border: 1px solid var(--line);
      color: var(--white);
      font-size: 1rem;
      margin-bottom: 16px;
      font-family: 'Inter', sans-serif;
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      font-size: .78rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 500;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--black);
      cursor: pointer;
      transition: all .3s;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover { background: var(--gold-2); }
    .btn-outline {
      background: transparent;
      color: var(--white);
      border-color: var(--line);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-danger {
      background: transparent;
      color: var(--red);
      border-color: rgba(248,113,113,.3);
    }
    .btn-danger:hover { background: rgba(248,113,113,.1); border-color: var(--red); }
    .btn-sm { padding: 8px 14px; font-size: .68rem; }
    .btn-block { width: 100%; }

    .login-error {
      color: var(--red);
      font-size: .85rem;
      margin-top: 12px;
      min-height: 20px;
    }

    /* ---------- DASHBOARD ---------- */
    .hidden { display: none !important; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 40px;
    }

    .dash-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .dash-logo {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      color: var(--gold);
      display: grid; place-items: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
    }
    .dash-title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 500;
    }
    .dash-title p {
      color: var(--grey-2);
      font-size: .75rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--black-2);
      border: 1px solid var(--line);
      padding: 24px;
    }
    .stat-card .label {
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--grey-2);
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--gold);
      line-height: 1;
    }
    .stat-card .value.small { font-size: 1.2rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .toolbar h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 500;
    }

    .filters-inline {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--grey);
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .25s;
    }
    .chip:hover { color: var(--gold); border-color: var(--gold); }
    .chip.active { color: var(--black); background: var(--gold); border-color: var(--gold); }

    /* ---------- BOOKINGS ---------- */
    .bookings {
      display: grid;
      gap: 16px;
    }
    .booking {
      background: var(--black-2);
      border: 1px solid var(--line);
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      transition: border-color .3s;
    }
    .booking:hover { border-color: rgba(201,162,75,.5); }

    .booking.cancelled { opacity: .5; }
    .booking.confirmed { border-left: 3px solid var(--green); }

    .booking-head {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .booking-id {
      font-family: 'Courier New', monospace;
      font-size: .8rem;
      color: var(--gold);
      background: rgba(201,162,75,.08);
      padding: 4px 10px;
      border: 1px solid var(--line);
    }
    .badge {
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid;
      font-weight: 500;
    }
    .badge.new { color: var(--gold); border-color: var(--gold); }
    .badge.confirmed { color: var(--green); border-color: rgba(74,222,128,.4); }
    .badge.cancelled { color: var(--red); border-color: rgba(248,113,113,.4); }
    .badge.pending_delivery { color: var(--yellow); border-color: rgba(251,191,36,.4); }

    .booking-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .booking-service {
      color: var(--gold);
      font-size: .85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .booking-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .detail {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .detail i {
      color: var(--gold);
      font-size: .85rem;
      margin-top: 4px;
      width: 16px;
    }
    .detail .label {
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--grey-2);
      margin-bottom: 2px;
    }
    .detail .value {
      font-size: .92rem;
      color: var(--white);
      word-break: break-word;
    }
    .detail a { color: var(--gold); text-decoration: underline; }

    .booking-message {
      grid-column: 1 / -1;
      padding: 16px;
      background: var(--black);
      border: 1px dashed var(--line);
      font-size: .9rem;
      color: var(--grey);
      font-style: italic;
    }

    .booking-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 140px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--grey-2);
    }
    .empty i {
      font-size: 2.4rem;
      color: var(--line);
      margin-bottom: 16px;
      display: block;
    }
    .empty p { font-size: .95rem; }
    .empty .hint { font-size: .8rem; margin-top: 12px; color: var(--grey-2); }

    @media (max-width: 720px) {
      .page { padding: 24px 20px; }
      .booking { grid-template-columns: 1fr; }
      .booking-actions { flex-direction: row; flex-wrap: wrap; min-width: 0; }
      .booking-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- ============ LOGIN SCREEN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">NK</div>
      <h1>Admin <em>Access</em></h1>
      <p>Enter your password to view bookings</p>

      <input type="password" id="passwordInput" placeholder="Admin password" autofocus>
      <button class="btn btn-block" id="loginBtn">
        Unlock <i class="fa-solid fa-arrow-right"></i>
      </button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div class="page hidden" id="dashboard">
    <div class="dash-header">
      <div class="dash-title">
        <div class="dash-logo">NK</div>
        <div>
          <h1>NK Blaq Studio</h1>
          <p>Bookings Dashboard</p>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Bookings</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="label">New</div>
        <div class="value" id="statNew">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Confirmed</div>
        <div class="value" id="statConfirmed">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Cancelled</div>
        <div class="value" id="statCancelled">0</div>
      </div>
    </div>

    <div class="toolbar">
      <h2>All Bookings</h2>
      <div class="filters-inline">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="new">New</button>
        <button class="chip" data-filter="confirmed">Confirmed</button>
        <button class="chip" data-filter="cancelled">Cancelled</button>
      </div>
    </div>

    <div class="bookings" id="bookingsList">
      <div class="empty">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <p>Loading bookings...</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5002/api/admin';
    let password = sessionStorage.getItem('nk_admin_pwd') || '';
    let bookings = [];
    let currentFilter = 'all';

    const $ = (s) => document.querySelector(s);

    /* ---------- Login ---------- */
    async function tryLogin() {
      const pwd = $('#passwordInput').value;
      const err = $('#loginError');
      err.textContent = '';

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();

        if (data.success) {
          password = pwd;
          sessionStorage.setItem('nk_admin_pwd', pwd);
          showDashboard();
        } else {
          err.textContent = data.error || 'Wrong password';
        }
      } catch (e) {
        err.textContent = 'Cannot reach backend. Is the server running?';
      }
    }

    function showDashboard() {
      $('#loginScreen').classList.add('hidden');
      $('#dashboard').classList.remove('hidden');
      loadBookings();
    }

    function logout() {
      password = '';
      sessionStorage.removeItem('nk_admin_pwd');
      $('#dashboard').classList.add('hidden');
      $('#loginScreen').classList.remove('hidden');
      $('#passwordInput').value = '';
    }

    /* ---------- Load bookings ---------- */
    async function loadBookings() {
      try {
        const res = await fetch(`${API_URL}/bookings`, {
          headers: { 'x-admin-password': password }
        });
        if (res.status === 401) { logout(); return; }
        bookings = await res.json();
        updateStats();
        renderBookings();
      } catch (e) {
        $('#bookingsList').innerHTML = `
          <div class="empty">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>Could not load bookings.</p>
            <p class="hint">Make sure the backend is running.</p>
          </div>`;
      }
    }

    function updateStats() {
      $('#statTotal').textContent = bookings.length;
      $('#statNew').textContent = bookings.filter(b => b.status === 'new').length;
      $('#statConfirmed').textContent = bookings.filter(b => b.status === 'confirmed').length;
      $('#statCancelled').textContent = bookings.filter(b => b.status === 'cancelled').length;
    }

    function renderBookings() {
      const filtered = currentFilter === 'all'
        ? bookings
        : bookings.filter(b => b.status === currentFilter);

      if (!filtered.length) {
        $('#bookingsList').innerHTML = `
          <div class="empty">
            <i class="fa-regular fa-folder-open"></i>
            <p>No bookings ${currentFilter !== 'all' ? 'with this status' : 'yet'}.</p>
            <p class="hint">When customers submit the form, they'll appear here.</p>
          </div>`;
        return;
      }

      $('#bookingsList').innerHTML = filtered.map(b => {
        const date = new Date(b.date).toLocaleDateString('en-GB', {
          day: '2-digit', month: 'short', year: 'numeric'
        });
        const created = new Date(b.createdAt).toLocaleString('en-GB', {
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });

        return `
          <article class="booking ${b.status}" data-id="${b.id}">
            <div>
              <div class="booking-head">
                <span class="booking-id">${b.id}</span>
                <span class="badge ${b.status}">${b.status.replace('_',' ')}</span>
              </div>

              <h3 class="booking-name">${b.name}</h3>
              <p class="booking-service">${b.service}</p>

              <div class="booking-details">
                <div class="detail">
                  <i class="fa-solid fa-envelope"></i>
                  <div>
                    <div class="label">Email</div>
                    <div class="value"><a href="mailto:${b.email}">${b.email}</a></div>
                  </div>
                </div>

                ${b.phone ? `
                <div class="detail">
                  <i class="fa-solid fa-phone"></i>
                  <div>
                    <div class="label">Phone</div>
                    <div class="value"><a href="tel:${b.phone}">${b.phone}</a></div>
                  </div>
                </div>` : ''}

                <div class="detail">
                  <i class="fa-solid fa-calendar"></i>
                  <div>
                    <div class="label">Session Date</div>
                    <div class="value">${date}</div>
                  </div>
                </div>

                ${b.location ? `
                <div class="detail">
                  <i class="fa-solid fa-location-dot"></i>
                  <div>
                    <div class="label">Location</div>
                    <div class="value">${b.location}</div>
                  </div>
                </div>` : ''}

                <div class="detail">
                  <i class="fa-solid fa-clock"></i>
                  <div>
                    <div class="label">Submitted</div>
                    <div class="value">${created}</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="booking-actions">
              ${b.status !== 'confirmed'
                ? `<button class="btn btn-sm" data-action="confirm" data-id="${b.id}">
                     <i class="fa-solid fa-check"></i> Confirm
                   </button>`
                : ''}
              ${b.status !== 'cancelled'
                ? `<button class="btn btn-sm btn-outline" data-action="cancel" data-id="${b.id}">
                     <i class="fa-solid fa-ban"></i> Cancel
                   </button>`
                : ''}
              <button class="btn btn-sm btn-danger" data-action="delete" data-id="${b.id}">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </div>

            ${b.message ? `<div class="booking-message">"${b.message}"</div>` : ''}
          </article>
        `;
      }).join('');
    }

    /* ---------- Update booking status ---------- */
    async function updateStatus(id, status) {
      try {
        const res = await fetch(`${API_URL}/bookings/${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': password
          },
          body: JSON.stringify({ status })
        });
        if (res.status === 401) { logout(); return; }
        await loadBookings();
      } catch (e) {
        alert('Could not update. Check backend.');
      }
    }

    async function deleteBooking(id) {
      if (!confirm('Delete this booking permanently?')) return;
      try {
        const res = await fetch(`${API_URL}/bookings/${id}`, {
          method: 'DELETE',
          headers: { 'x-admin-password': password }
        });
        if (res.status === 401) { logout(); return; }
        await loadBookings();
      } catch (e) {
        alert('Could not delete.');
      }
    }

    /* ---------- Event listeners ---------- */
    $('#loginBtn').addEventListener('click', tryLogin);
    $('#passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryLogin();
    });
    $('#logoutBtn').addEventListener('click', logout);

    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (chip) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        renderBookings();
        return;
      }

      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        const id = actionBtn.dataset.id;
        const action = actionBtn.dataset.action;
        if (action === 'confirm') updateStatus(id, 'confirmed');
        if (action === 'cancel') actionBtn.dataset.action = 'cancel',
          updateStatus(id, 'cancelled');
        if (action === 'delete') deleteBooking(id);
      }
    });

    /* ---------- Auto-login if already authenticated this session ---------- */
    if (password) {
      showDashboard();
    }
  </script>
</body>
</html>
